[project]
name = "devdocs-mcp"
version = "0.1.0"
description = "A local DevDocs clone exposed as an MCP server: search and read API documentation for hundreds of languages and libraries, offline."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "devdocs", "documentation", "model-context-protocol"]
dependencies = [
    "mcp>=2.3,<3",
    "httpx2>=2.10",
    "beautifulsoup4>=4.12",
    "markdownify>=1.0",
]

[project.scripts]
devdocs-mcp = "devdocs_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devdocs_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E501"]  # HTML fixtures
