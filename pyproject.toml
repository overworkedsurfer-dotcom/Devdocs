[project]
name = "docshelf"
version = "0.2.0"
description = "Your knowledge folder (notes, docs, and web pages saved from your browser) searchable by AI assistants over MCP."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "knowledge-base", "documentation", "search", "model-context-protocol"]
dependencies = [
    "mcp>=2.3,<3",
    "httpx2>=2.10",
    "beautifulsoup4>=4.12",
    "markdownify>=1.0",
    "pypdf>=5",
]

[project.scripts]
docshelf = "docshelf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docshelf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # HTML and Markdown fixtures
